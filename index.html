<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aroma Indian Grill & Bar | Premier Indian Dining Preview</title>
  <meta name="description" content="Experience authentic royal Indian gastronomy at Aroma Indian Grill & Bar. Premium static preview for mobile and desktop display.">
  <meta name="theme-color" content="#061518">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/curry.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      /* Royal Color Palette */
      --bg-main: #061518;
      --bg-card: rgba(13, 34, 39, 0.8);
      --bg-card-hover: rgba(20, 52, 60, 0.9);
      --bg-glass: rgba(10, 31, 36, 0.7);
      --bg-glass-heavy: rgba(6, 21, 24, 0.95);
      --bg-secondary: #0a2127;
      --bg-surface: #0e2d35;

      /* Accent Saffron & Gold */
      --gold-primary: #f3bf37;
      --gold-secondary: #d4af37;
      --gold-light: #fbe69b;
      --gold-glow: rgba(243, 191, 55, 0.35);
      --saffron-orange: #ff7a18;
      --saffron-glow: rgba(255, 122, 24, 0.4);
      --ruby-red: #e63946;
      --emerald-green: #10b981;

      /* Text colors */
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-gold: #f3bf37;

      /* Borders & Shadows */
      --border-subtle: rgba(243, 191, 55, 0.15);
      --border-glow: rgba(243, 191, 55, 0.45);
      --border-glass: rgba(255, 255, 255, 0.08);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.65);
      --shadow-gold: 0 8px 30px rgba(243, 191, 55, 0.22);

      /* Typography */
      --font-serif: 'Cinzel', 'Playfair Display', Georgia, serif;
      --font-display: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Radii & Transitions */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 9999px;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
      background-color: var(--bg-main);
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      background-color: var(--bg-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 0;
    }

    /* Ambient Background Light Orbs */
    body::before {
      content: '';
      position: fixed;
      top: -150px;
      left: 10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(243, 191, 55, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -150px;
      right: 10%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 122, 24, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-surface);
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-secondary);
    }

    /* Typography styles */
    h1, h2, h3, h4, .font-serif {
      font-family: var(--font-serif);
      color: #ffffff;
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    h5, h6, .font-display {
      font-family: var(--font-display);
    }

    p {
      color: var(--text-secondary);
    }

    /* Containers */
    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* Navbar styling */
    .navbar-wrapper {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(6, 21, 24, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      transition: all var(--transition-smooth);
    }

    .navbar-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 84px;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
    }

    .brand-emblem-text {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold-primary);
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      position: relative;
      padding: 0.5rem 0;
      letter-spacing: 0.03em;
      transition: color var(--transition-fast);
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--gold-light);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold-primary), var(--saffron-orange));
      transition: width var(--transition-smooth);
      border-radius: 2px;
    }

    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .cart-toggle-btn {
      position: relative;
      background: rgba(243, 191, 55, 0.1);
      border: 1px solid var(--border-subtle);
      color: var(--gold-light);
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }

    .cart-toggle-btn:hover {
      background: rgba(243, 191, 55, 0.25);
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }

    .cart-badge-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: linear-gradient(135deg, #ff7a18, #e63946);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(230, 57, 70, 0.5);
      border: 2px solid var(--bg-main);
      animation: pulseBadge 2s infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-smooth);
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      user-select: none;
    }

    .btn-gold {
      background: linear-gradient(135deg, #fce07a 0%, #f3bf37 50%, #e59819 100%);
      color: #051417;
      box-shadow: var(--shadow-gold);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(243, 191, 55, 0.45);
      background: linear-gradient(135deg, #ffffff 0%, #fce07a 50%, #f3bf37 100%);
    }

    .btn-outline-gold {
      background: rgba(243, 191, 55, 0.06);
      color: var(--gold-light);
      border: 1px solid var(--gold-secondary);
      backdrop-filter: blur(10px);
    }
    .btn-outline-gold:hover {
      background: rgba(243, 191, 55, 0.18);
      border-color: var(--gold-primary);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: var(--shadow-gold);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-glass);
    }
    .btn-secondary:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-subtle);
      transform: translateY(-2px);
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
    }

    .btn-lg {
      padding: 1.1rem 2.4rem;
      font-size: 1.05rem;
      border-radius: var(--radius-lg);
    }

    /* Sections */
    .section {
      padding: 6.5rem 0;
      position: relative;
    }
    .section-header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 3.5rem;
    }
    .section-tag {
      font-family: var(--font-display);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold-primary);
      font-weight: 700;
      margin-bottom: 0.6rem;
      display: inline-block;
    }
    .section-title {
      font-size: 2.6rem;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .section-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* Hero Section */
    .hero-section {
      position: relative;
      min-height: 85vh;
      display: flex;
      align-items: center;
      padding: 4rem 0 5rem;
      overflow: hidden;
    }
    .hero-bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6, 21, 24, 0.4) 0%, rgba(6, 21, 24, 0.95) 85%, #061518 100%),
                  radial-gradient(circle at 75% 35%, rgba(243, 191, 55, 0.1) 0%, transparent 60%);
      z-index: 1;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3.5rem;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 1.1rem;
      background: rgba(243, 191, 55, 0.1);
      border: 1px solid rgba(243, 191, 55, 0.3);
      border-radius: var(--radius-full);
      color: var(--gold-light);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .hero-title {
      font-size: 3.5rem;
      line-height: 1.12;
      margin-bottom: 1.5rem;
    }
    .hero-title span.gold {
      background: linear-gradient(135deg, #ffffff 0%, #fbe69b 50%, #f3bf37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-subtitle {
      font-size: 1.12rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 2.2rem;
      max-width: 580px;
    }
    .hero-cta-group {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    .hero-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-subtle);
    }
    .hero-stat-item h3 {
      font-size: 1.8rem;
      color: var(--gold-primary);
      margin-bottom: 0.2rem;
    }
    .hero-stat-item p {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .hero-visual-card {
      position: relative;
      border-radius: var(--radius-xl);
      overflow: hidden;
      padding: 1rem;
      background: linear-gradient(145deg, rgba(243, 191, 55, 0.15), rgba(10, 33, 39, 0.8));
      border: 1px solid var(--border-subtle);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }
    .hero-image-box {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      height: 440px;
    }
    .hero-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }
    .hero-visual-card:hover .hero-image-box img {
      transform: scale(1.04);
    }
    .hero-floating-badge {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      background: rgba(6, 21, 24, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-info h4 {
      font-size: 1.05rem;
      margin-bottom: 0.2rem;
    }
    .badge-info p {
      font-size: 0.8rem;
      color: var(--gold-light);
    }

    /* Quick Reservation Strip */
    .quick-reserve-strip {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.5rem 2rem;
      margin-top: -3.5rem;
      position: relative;
      z-index: 10;
      box-shadow: var(--shadow-lg);
    }
    .quick-strip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 1.5rem;
      align-items: center;
    }
    .quick-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .quick-field label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-light);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .quick-field input, .quick-field select {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .quick-field input:focus, .quick-field select:focus {
      border-color: var(--gold-primary);
    }

    /* Menu Cards & Grid */
    .menu-controls {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .category-tabs {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .category-tab {
      white-space: nowrap;
      padding: 0.7rem 1.4rem;
      border-radius: var(--radius-full);
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .category-tab:hover {
      background: var(--bg-surface);
      color: #ffffff;
      border-color: var(--border-subtle);
    }
    .category-tab.active {
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
      color: #051417;
      border-color: transparent;
      box-shadow: var(--shadow-gold);
    }
    .menu-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      background: var(--bg-glass);
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    .search-input-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }
    .search-input-box input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
    }
    .search-input-box svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .dietary-filters {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .filter-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all var(--transition-fast);
    }
    .filter-chip.active {
      background: rgba(243, 191, 55, 0.2);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 2rem;
    }

    /* Individual Dish Card */
    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all var(--transition-smooth);
      position: relative;
    }
    .menu-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-glow);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), var(--shadow-gold);
    }
    .menu-card-image-box {
      position: relative;
      height: 210px;
      overflow: hidden;
    }
    .menu-card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .menu-card:hover .menu-card-image-box img {
      transform: scale(1.06);
    }
    .card-top-badges {
      position: absolute;
      top: 0.9rem;
      left: 0.9rem;
      right: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .menu-card-content {
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
    }
    .dish-name {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: #ffffff;
      line-height: 1.25;
    }
    .dish-price {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold-primary);
      white-space: nowrap;
    }
    .dish-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.2rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .dish-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 1.2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .dish-spice-meter {
      display: flex;
      align-items: center;
      gap: 0.15rem;
    }
    .card-footer-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.8rem;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-gold {
      background: rgba(243, 191, 55, 0.15);
      color: var(--gold-light);
      border: 1px solid rgba(243, 191, 55, 0.3);

      // --- Cart Handlers ---
      const handleAddToCart = (item, options) => {
        setCart(prev => {
          const exists = prev.find(i => 
            i.id === item.id && 
            i.selectedProtein === options.protein && 
            i.spiceLevel === options.spiceLevel
          );

          if (exists) {
            return prev.map(i => 
              i.id === item.id && 
              i.selectedProtein === options.protein && 
              i.spiceLevel === options.spiceLevel
                ? { ...i, quantity: i.quantity + options.quantity }
                : i
            );
          }

          return [...prev, {
            ...item,
            quantity: options.quantity,
            selectedProtein: options.protein,
            spiceLevel: options.spiceLevel,
            notes: options.notes,
            addonName: options.addonName,
            addonPrice: options.addonPrice
          }];
        });
        setSelectedItemForModal(null);
        showToast(`${item.name} added to cart!`);

        setCart(prev => prev.map((item, i) => {

            const nextQty = item.quantity + amount;
            return nextQty > 0 ? { ...item, quantity: nextQty } : item;

          return item;

      const subtotal = cart.reduce((acc, item) => acc + (item.price + (item.addonPrice || 0)) * item.quantity, 0);

      const tipAmount = subtotal * (tipPercentage / 100);
      const cartTotal = subtotal - discount + tax + deliveryFee + tipAmount;

          id: bookingId,
          date: formData.date || quickDate,
          time: formData.time || quickTime,
          guests: formData.guests || quickGuests,

    // --- Sub-View: Menu Screen ---
    function MenuView({ menuItems, setSelectedItemForModal }) {
      const [activeCategory, setActiveCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [dietFilter, setDietFilter] = useState('all'); // 'all' | 'veg' | 'nonveg'

      const categories = [
        { id: 'all', label: 'Complete Menu' },
        { id: 'starters', label: 'Starters & Street Food' },
        { id: 'sizzlers', label: 'Clay Oven Sizzlers' },
        { id: 'curries', label: 'Slow Cooked Curries' },
        { id: 'biryanis', label: 'Dum Biryanis' },
        { id: 'breads', label: 'Tandoor Breads' },
        { id: 'desserts', label: 'Royal Desserts' },
        { id: 'drinks', label: 'Craft & Sodas' }
      ];

      // Filtered list
      const filtered = menuItems.filter(item => {
        const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || item.desc.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesDiet = dietFilter === 'all' || (dietFilter === 'veg' && item.isVeg) || (dietFilter === 'nonveg' && !item.isVeg);
        return matchesCategory && matchesSearch && matchesDiet;
      });

      return (
        <section className="section" style={{ paddingTop: '3rem' }}>
          <div className="container">
            <div className="section-header" style={{ marginBottom: '2.5rem' }}>
              <span className="section-tag">Aroma Table Menu</span>
              <h2 className="section-title">Explore Digital Menu</h2>
              <p className="section-subtitle">Customize proteins, select spice levels, and add directly to your checkout card.</p>
            </div>

            <div className="menu-controls">
              <div className="category-tabs">
                {categories.map(cat => (
                  <button
                    key={cat.id}
                    className={`category-tab ${activeCategory === cat.id ? 'active' : ''}`}
                    onClick={() => setActiveCategory(cat.id)}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>

              <div className="menu-filter-bar">
                <div className="search-input-box">
                  <Icon name="star" size={16} />
                  <input
                    type="text"
                    placeholder="Search butter chicken, lamb chop, naan..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                  />
                </div>

                <div className="dietary-filters">
                  <button className={`filter-chip ${dietFilter === 'all' ? 'active' : ''}`} onClick={() => setDietFilter('all')}>
                    All Dishes
                  </button>
                  <button className={`filter-chip ${dietFilter === 'veg' ? 'active' : ''}`} onClick={() => setDietFilter('veg')}>
                    🟢 Veg Only
                  </button>
                  <button className={`filter-chip ${dietFilter === 'nonveg' ? 'active' : ''}`} onClick={() => setDietFilter('nonveg')}>
                    🔴 Non-Veg (Halal)
                  </button>
                </div>
              </div>
            </div>

            {filtered.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '4rem 1rem', color: 'var(--text-muted)' }}>
                <p>No dishes found matching your criteria. Try adjusting filters!</p>
              </div>
            ) : (
              <div className="menu-grid">
                {filtered.map(item => (
                  <div key={item.id} className="menu-card">
                    <div className="menu-card-image-box">
                      <img src={item.image} alt={item.name} />
                      <div className="card-top-badges">
                        {item.isChefSpecial && <span className="badge badge-gold">Specialty</span>}
                        <span className={`badge ${item.isVeg ? 'badge-veg' : 'badge-nonveg'}`}>
                          {item.isVeg ? 'VEG' : 'NON-VEG'}
                        </span>
                      </div>
                    </div>
                    <div className="menu-card-content">
                      <div className="card-header-row">
                        <h3 className="dish-name">{item.name}</h3>
                        <span className="dish-price">${item.price}</span>
                      </div>
                      <p className="dish-desc">{item.desc}</p>
                      <div className="dish-meta-row">
                        <span>Diet: {item.isVeg ? 'Vegetarian' : 'Halal'}</span>
                        {item.spiceLevel > 0 && (
                          <div className="dish-spice-meter">
                            <span>Heat:</span>
                            {Array.from({ length: item.spiceLevel }).map((_, i) => (
                              <span key={i} style={{ color: '#ff5722' }}>🌶️</span>

                          </div>
                        )}
                      </div>
                      <div className="card-footer-actions">
                        <button className="btn btn-gold btn-sm" onClick={() => setSelectedItemForModal(item)}>
                          Customize & Add
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>
      );
    }

    // --- Sub-View: Order Tracking Screen ---
    function OrderTrackingView({ orderId, orders, navigateTo }) {
      const activeOrder = orders.find(o => o.orderId === orderId) || orders[0];
      const [status, setStatus] = useState(activeOrder ? activeOrder.status : 'order_received');

      // Auto update status animation
      useEffect(() => {
        if (!activeOrder) return;
        setStatus(activeOrder.status);

        const timer = setInterval(() => {
          setStatus(current => {
            if (current === 'order_received') return 'preparing';
            if (current === 'preparing') return 'cooking';
            if (current === 'cooking') return 'ready_for_delivery';
            return current;
          });
        }, 15000); // changes status phases every 15s for visual simulation

        return () => clearInterval(timer);
      }, [orderId]);

      if (!activeOrder) {
        return (
          <div className="container" style={{ padding: '6rem 1rem', textAlign: 'center' }}>
            <p>No active order selected for tracking.</p>
            <button className="btn btn-gold btn-sm" onClick={() => navigateTo('menu')} style={{ marginTop: '1rem' }}>Browse Menu</button>
          </div>
        );
      }

      const steps = [
        { id: 'order_received', label: 'Received' },
        { id: 'preparing', label: 'Preparing' },
        { id: 'cooking', label: 'In Tandoor' },
        { id: 'ready_for_delivery', label: 'Out for Delivery' }
      ];

      const getStepIndex = (s) => steps.findIndex(x => x.id === s);
      const activeIdx = getStepIndex(status);

      return (
        <section className="section" style={{ paddingTop: '3rem' }}>
          <div className="container">
            <div className="order-tracker-card">
              <div style={{ textAlign: 'center', marginBottom: '2.5rem' }}>
                <span className="badge badge-gold" style={{ marginBottom: '0.5rem' }}>Live Order Tracking</span>
                <h2 style={{ fontSize: '1.8rem', color: '#fff', fontFamily: 'var(--font-serif)' }}>Order #{activeOrder.orderId} status</h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Estimated arrival: 25-35 minutes</p>
              </div>

              <div className="tracker-timeline">
                {steps.map((st, i) => {
                  let statusClass = '';
                  if (i < activeIdx) statusClass = 'completed';
                  else if (i === activeIdx) statusClass = 'active';

                  return (
                    <div key={st.id} className={`tracker-step ${statusClass}`}>
                      <div className="step-circle">
                        {i < activeIdx ? '✓' : i + 1}
                      </div>
                      <span style={{ fontSize: '0.85rem', fontWeight: 600, color: i <= activeIdx ? 'var(--gold-light)' : 'var(--text-muted)' }}>
                        {st.label}
                      </span>
                    </div>
                  );
                })}
              </div>

              <div className="glass-card" style={{ padding: '1.5rem', marginTop: '3rem' }}>
                <h3 style={{ fontSize: '1.1rem', color: '#fff', marginBottom: '1rem', fontFamily: 'var(--font-serif)' }}>Items in Order</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem', fontSize: '0.88rem' }}>
                  {activeOrder.items?.map((item, idx) => (
                    <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-secondary)' }}>
                      <span>{item.quantity}x {item.name}</span>
                      <span>${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                  ))}
                  <div style={{ borderTop: '1px solid var(--border-glass)', marginTop: '0.8rem', paddingTop: '0.8rem', display: 'flex', justifyContent: 'space-between', fontWeight: 700, color: 'var(--gold-primary)', fontSize: '1.05rem' }}>
                    <span>Total Charged via Square:</span>
                    <span>${activeOrder.total?.toFixed(2)}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

                  </div>
                )}

                {/* Notes */}
                <div>
                  <label style={{ display: 'block', fontSize: '0.75rem', color: 'var(--gold-light)', fontWeight: 700, marginBottom: '0.4rem', textTransform: 'uppercase' }}>Preparation Notes</label>
                  <input type="text" placeholder="Extra cilantro, sauce on the side, no onions..." value={notes} onChange={e => setNotes(e.target.value)} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.6rem', color: '#fff', borderRadius: '4px' }} />

    // --- Sub-View: Cart Drawer ---
    function CartDrawer({ cart, onClose, handleUpdateQuantity, handleRemoveFromCart, subtotal, discount, tax, deliveryFee, tipPercentage, setTipPercentage, tipAmount, cartTotal, promoCode, setPromoCode, handleApplyPromo, appliedPromo, fulfillmentType, setFulfillmentType, userDetails, setUserDetails, handleCheckoutTrigger }) {
      const [customTipActive, setCustomTipActive] = useState(false);

      return (
        <div className="cart-drawer-overlay" onClick={onClose}>
          <div className="cart-drawer" onClick={e => e.stopPropagation()}>
            <div className="cart-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                <Icon name="shoppingbag" size={20} color="var(--gold-primary)" />
                <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.25rem', color: '#fff' }}>Your Feast Cart</h2>
              </div>
              <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#fff', cursor: 'pointer' }}>
                <Icon name="x" size={22} />
              </button>
            </div>

            {/* Toggle pickup vs delivery */}
            <div style={{ padding: '1rem 1.5rem', background: 'var(--bg-surface)', borderBottom: '1px solid var(--border-glass)' }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', background: 'var(--bg-main)', padding: '4px', borderRadius: '8px' }}>
                <button className="btn btn-sm" style={{ background: fulfillmentType === 'pickup' ? 'var(--gold-primary)' : 'transparent', color: fulfillmentType === 'pickup' ? '#000' : '#fff' }} onClick={() => setFulfillmentType('pickup')}>Pickup (Free)</button>
                <button className="btn btn-sm" style={{ background: fulfillmentType === 'delivery' ? 'var(--gold-primary)' : 'transparent', color: fulfillmentType === 'delivery' ? '#000' : '#fff' }} onClick={() => setFulfillmentType('delivery')}>Delivery ($4.99)</button>
              </div>
            </div>

            <div className="cart-items-scroll">
              {cart.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '4rem 1rem', color: 'var(--text-muted)' }}>
                  <p>Your cart is empty. Start adding delicious Royal treats!</p>
                </div>
              ) : (
                cart.map((item, idx) => (
                  <div key={idx} className="cart-item-row">
                    <img src={item.image} alt={item.name} className="cart-item-thumb" />
                    <div className="cart-item-details">
                      <div>
                        <h4 className="cart-item-title">{item.name}</h4>
                        <p style={{ fontSize: '0.75rem', color: 'var(--gold-primary)' }}>
                          {item.selectedProtein ? `Protein: ${item.selectedProtein}` : ''} 
                          {item.spiceLevel ? ` • Spice: ${item.spiceLevel}🌶️` : ''}
                          {item.addonName ? ` • ${item.addonName}` : ''}
                        </p>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div className="cart-qty-control">
                          <button className="qty-btn" onClick={() => handleUpdateQuantity(idx, -1)}>-</button>
                          <span style={{ fontSize: '0.9rem', fontWeight: 600 }}>{item.quantity}</span>
                          <button className="qty-btn" onClick={() => handleUpdateQuantity(idx, 1)}>+</button>
                        </div>
                        <span style={{ fontWeight: 700, color: 'var(--gold-primary)', fontSize: '0.95rem' }}>
                          ${((item.price + (item.addonPrice || 0)) * item.quantity).toFixed(2)}
                        </span>
                        <button onClick={() => handleRemoveFromCart(idx)} style={{ background: 'transparent', border: 'none', color: '#ef4444', cursor: 'pointer' }}><Icon name="trash" size={15} /></button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            {cart.length > 0 && (
              <div className="cart-footer">
                {/* Checkout forms */}
                <div style={{ marginBottom: '1.2rem', display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
                  <div style={{ display: 'flex', gap: '0.5rem' }}>
                    <input
                      type="text"
                      placeholder="Promo Code (AROMA15)"
                      value={promoCode}
                      onChange={e => setPromoCode(e.target.value)}
                      style={{ flex: 1, background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.55rem', borderRadius: '4px', color: '#fff', fontSize: '0.85rem' }}
                    />
                    <button className="btn btn-gold btn-sm" onClick={() => handleApplyPromo(promoCode)}>Apply</button>
                  </div>
                  {appliedPromo && <p style={{ fontSize: '0.78rem', color: 'var(--emerald-green)' }}>✓ 15% discount applied successfully!</p>}
                </div>

                {/* Tips */}
                <div style={{ marginBottom: '1.2rem' }}>
                  <span style={{ fontSize: '0.75rem', color: 'var(--gold-light)', fontWeight: 700, display: 'block', marginBottom: '0.4rem' }}>ADD TIP FOR STAFF</span>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.4rem' }}>
                    {[15, 18, 20, 25].map(pct => (
                      <button
                        key={pct}
                        className="btn btn-secondary btn-sm"
                        style={{ background: tipPercentage === pct ? 'var(--gold-primary)' : 'var(--bg-surface)', color: tipPercentage === pct ? '#000' : '#fff', fontSize: '0.78rem' }}
                        onClick={() => { setTipPercentage(pct); setCustomTipActive(false); }}
                      >
                        {pct}%
                      </button>
                    ))}
                  </div>
                </div>

                {/* Summary */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem', borderTop: '1px solid var(--border-glass)', paddingTop: '0.8rem', marginBottom: '1rem' }}>
                  <div className="cart-summary-line"><span>Subtotal:</span><span>${subtotal.toFixed(2)}</span></div>
                  {discount > 0 && <div className="cart-summary-line" style={{ color: 'var(--emerald-green)' }}><span>Discount (15%):</span><span>-${discount.toFixed(2)}</span></div>}
                  <div className="cart-summary-line"><span>Tax (8.25%):</span><span>${tax.toFixed(2)}</span></div>
                  {fulfillmentType === 'delivery' && <div className="cart-summary-line"><span>Delivery Fee:</span><span>${deliveryFee.toFixed(2)}</span></div>}
                  <div className="cart-summary-line"><span>Staff Tip:</span><span>${tipAmount.toFixed(2)}</span></div>
                  <div className="cart-summary-line total"><span>Total:</span><span>${cartTotal.toFixed(2)}</span></div>
                </div>

                {/* Billing Details fields */}
                <div style={{ borderTop: '1px solid var(--border-glass)', paddingTop: '1rem', marginBottom: '1.2rem', display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
                  <span style={{ fontSize: '0.75rem', color: 'var(--gold-light)', fontWeight: 700, display: 'block' }}>DELIVERY & CONTACT DETAILS</span>
                  <input type="text" placeholder="Your Full Name *" required value={userDetails.name} onChange={e => setUserDetails({ ...userDetails, name: e.target.value })} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.5rem', color: '#fff', borderRadius: '4px', fontSize: '0.82rem' }} />
                  <input type="tel" placeholder="Mobile Phone (SMS Alerts) *" required value={userDetails.phone} onChange={e => setUserDetails({ ...userDetails, phone: e.target.value })} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.5rem', color: '#fff', borderRadius: '4px', fontSize: '0.82rem' }} />
                  {fulfillmentType === 'delivery' && (
                    <input type="text" placeholder="Street Address *" required value={userDetails.street} onChange={e => setUserDetails({ ...userDetails, street: e.target.value })} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.5rem', color: '#fff', borderRadius: '4px', fontSize: '0.82rem' }} />
                  )}
                </div>

                <button className="btn btn-gold btn-lg" style={{ width: '100%' }} onClick={(e) => {
                  if (!userDetails.name || !userDetails.phone) {
                    alert('Please provide name and phone');
                    return;
                  }
                  if (fulfillmentType === 'delivery' && !userDetails.street) {
                    alert('Please enter delivery address');
                    return;
                  }
                  handleCheckoutTrigger();
                }}>
                  Checkout via Square →
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Sub-View: Square Payment Modal Simulation ---
    function SquarePaymentModal({ total, onClose, onSuccess }) {
      const [formData, setFormData] = useState({ card: '4111 2222 3333 4444', exp: '12/28', cvv: '123' });
      const [loading, setLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          onSuccess();
        }, 1500);
      };

      return (
        <div className="modal-backdrop" onClick={onClose} style={{ zIndex: 4800 }}>
          <div className="modal-dialog" onClick={e => e.stopPropagation()} style={{ maxWidth: '420px' }}>
            <button className="modal-close-btn" onClick={onClose}><Icon name="x" size={20} /></button>

            <div style={{ padding: '2rem' }}>
              <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
                <Icon name="shield" size={28} color="var(--gold-primary)" style={{ margin: '0 auto 0.5rem' }} />
                <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.25rem', color: '#fff' }}>Secure Square Checkout</h3>
                <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Amount to charge: <span style={{ color: 'var(--gold-primary)', fontWeight: 700 }}>${total.toFixed(2)}</span></p>
              </div>

              <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1.1rem' }}>
                <div>
                  <label style={{ display: 'block', fontSize: '0.72rem', color: 'var(--gold-light)', fontWeight: 700, marginBottom: '0.3rem' }}>CARD NUMBER *</label>
                  <input type="text" required value={formData.card} onChange={e => setFormData({ ...formData, card: e.target.value })} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.6rem', color: '#fff', borderRadius: '4px', fontSize: '0.9rem', outline: 'none' }} />
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                  <div>
                    <label style={{ display: 'block', fontSize: '0.72rem', color: 'var(--gold-light)', fontWeight: 700, marginBottom: '0.3rem' }}>EXPIRY *</label>
                    <input type="text" required value={formData.exp} onChange={e => setFormData({ ...formData, exp: e.target.value })} placeholder="MM/YY" style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.6rem', color: '#fff', borderRadius: '4px', fontSize: '0.9rem', outline: 'none' }} />
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: '0.72rem', color: 'var(--gold-light)', fontWeight: 700, marginBottom: '0.3rem' }}>CVV *</label>
                    <input type="password" required value={formData.cvv} onChange={e => setFormData({ ...formData, cvv: e.target.value })} placeholder="•••" style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.6rem', color: '#fff', borderRadius: '4px', fontSize: '0.9rem', outline: 'none' }} />
                  </div>
                </div>

                <button type="submit" disabled={loading} className="btn btn-gold" style={{ width: '100%', marginTop: '0.5rem' }}>
                  {loading ? 'Processing via Square...' : `Pay $${total.toFixed(2)}`}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // --- Sub-View: Auth Modal Simulation ---
    function AuthModal({ isOpen, onClose, mode, setMode, handleLogin, handleRegister }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');

      if (!isOpen) return null;

      const onSubmit = (e) => {
        e.preventDefault();
        if (mode === 'login') {
          handleLogin(email, password);
        } else {
          handleRegister({ name, email, phone: '(803) 555-0199', street: '9648 Red Stone Dr' });
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-dialog" onClick={e => e.stopPropagation()} style={{ maxWidth: '440px' }}>
            <button className="modal-close-btn" onClick={onClose}><Icon name="x" size={20} /></button>

            <div style={{ padding: '2rem' }}>
              <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
                <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.5rem', color: '#fff', marginBottom: '0.3rem' }}>Aroma Dining Club</h3>
                <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Unlock rewards and view live order statuses.</p>
              </div>

              {/* Tab Selector */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', background: 'var(--bg-surface)', padding: '4px', borderRadius: '6px', marginBottom: '1.5rem' }}>
                <button className="btn btn-sm" style={{ background: mode === 'login' ? 'var(--gold-primary)' : 'transparent', color: mode === 'login' ? '#000' : '#fff' }} onClick={() => setMode('login')}>Sign In</button>
                <button className="btn btn-sm" style={{ background: mode === 'register' ? 'var(--gold-primary)' : 'transparent', color: mode === 'register' ? '#000' : '#fff' }} onClick={() => setMode('register')}>Register</button>
              </div>

              <form onSubmit={onSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                {mode === 'register' && (
                  <div>
                    <label style={{ display: 'block', fontSize: '0.72rem', color: 'var(--gold-light)', fontWeight: 700, marginBottom: '0.3rem' }}>FULL NAME</label>
                    <input type="text" required placeholder="Priya Sharma" value={name} onChange={e => setName(e.target.value)} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.6rem', color: '#fff', borderRadius: '4px' }} />
                  </div>
                )}

                <div>
                  <label style={{ display: 'block', fontSize: '0.72rem', color: 'var(--gold-light)', fontWeight: 700, marginBottom: '0.3rem' }}>EMAIL ADDRESS</label>
                  <input type="email" required placeholder="name@example.com" value={email} onChange={e => setEmail(e.target.value)} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.6rem', color: '#fff', borderRadius: '4px' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '0.72rem', color: 'var(--gold-light)', fontWeight: 700, marginBottom: '0.3rem' }}>PASSWORD</label>
                  <input type="password" required placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', background: 'var(--bg-main)', border: '1px solid var(--border-glass)', padding: '0.6rem', color: '#fff', borderRadius: '4px' }} />
                </div>

                <button type="submit" className="btn btn-gold" style={{ width: '100%', marginTop: '0.5rem' }}>
                  {mode === 'login' ? 'Sign In' : 'Create Account'}
                </button>
              </form>

              <div style={{ marginTop: '1.5rem', paddingTop: '1rem', borderTop: '1px solid var(--border-glass)', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem' }}>
                <button className="btn btn-secondary btn-sm" style={{ fontSize: '0.75rem' }} onClick={() => handleLogin('priya@example.com', 'password')}>Demo Customer</button>
                <button className="btn btn-outline-gold btn-sm" style={{ fontSize: '0.75rem' }} onClick={() => handleLogin('admin@aromaindiangrill.com', 'admin')}>Demo Admin</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Mount application ---
    const rootElement = document.getElementById('app-root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>
</body>
</html>
